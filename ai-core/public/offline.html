<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>NEXORA QR — غير متصل</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; background: #f4f6fa; color: #0f172a; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); border: 1px solid #dbe4e2; border-radius: 28px; background: #fff; padding: 30px; box-shadow: 0 20px 60px #0b102014; }
    .mark { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 17px; background: #0b1020; color: #6ee7b7; font-size: 28px; font-weight: 900; }
    h1 { margin: 22px 0 8px; font-size: 24px; }
    p { line-height: 1.9; color: #475569; }
    button { width: 100%; margin-top: 12px; padding: 14px 18px; border: 0; border-radius: 14px; background: #047857; color: white; font: inherit; font-weight: 800; cursor: pointer; }
    small { display: block; margin-top: 16px; color: #64748b; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>محتاجين اتصال بالإنترنت</h1>
    <p>لوحة NEXORA بتحتاج اتصالًا مباشرًا عشان تعرض الأسعار والطلبات الحالية وتحفظ التعديلات بأمان.</p>
    <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    <small>مش هنخزّن الطلبات أو بيانات العملاء على الجهاز للاستخدام دون اتصال.</small>
  </main>
</body>
</html>
