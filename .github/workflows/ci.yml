name: CI — NEXORA QR

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'ai-core/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'ai-core/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexora_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd, intl, pdo_mysql, bcmath, exif
          coverage: none

      - name: Install Composer dependencies
        working-directory: ai-core
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit Composer dependencies
        working-directory: ai-core
        run: composer audit

      - name: Run Laravel Pint on changed PHP files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(git diff --name-only "$base" "$HEAD_SHA" -- 'ai-core/**/*.php' 'ai-core/*.php' | sed 's#^ai-core/##')
          if ((${#files[@]})); then
            (cd ai-core && vendor/bin/pint --test "${files[@]}")
          else
            echo "No changed PHP files to format-check."
          fi

      - name: Install Node dependencies
        working-directory: ai-core
        run: npm ci

      - name: Audit production npm dependencies
        working-directory: ai-core
        run: npm audit --omit=dev

      - name: TypeScript type check
        working-directory: ai-core
        run: npm run typecheck

      - name: Build frontend assets
        working-directory: ai-core
        run: npm run build

      - name: Configure Laravel test environment
        working-directory: ai-core
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations against MySQL
        working-directory: ai-core
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexora_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run Laravel tests against MySQL
        working-directory: ai-core
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexora_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
